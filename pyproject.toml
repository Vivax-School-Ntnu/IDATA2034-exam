[project]
name = "idata2034-exam"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "shared",
    "server",
    "controller",
    "device",
    "pytest",
    "ruff",
    "basedpyright",
    "hypothesis>=6.168.5",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
required-version = ">=0.13.4"

[tool.uv.sources]
shared = { workspace = true }
server = { workspace = true }
controller = { workspace = true }
device = { workspace = true }

[tool.uv.workspace]
members = [
    "shared",
    "server",
    "controller",
    "device",
]

[tool.pytest.ini_options]
addopts = "--log-level=DEBUG -n auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "ERA",
    "ASYNC",
    "A",
    "ARG",
    "N",
    "D"
]
extend-ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Don't complain about docs in tests
"**/tests/**" = ["D"]
"**/*_test.py" = ["D"]

[tool.pyright]
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true
reportMissingTypeStubs = false
enableExperimentalFeatures = true # required for pydantic type checking to work properly
